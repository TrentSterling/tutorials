name: Tutorial responsive layout
on:
  pull_request:
    paths:
      - index.html
      - tools/layout-audit/**
      - .github/workflows/tutorial-layout.yml
permissions:
  contents: read
concurrency:
  group: tutorial-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reading-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TUTORIAL_LAYOUT_BASELINE: .local/tutorial-layout-baseline
      TUTORIAL_LAYOUT_OUTPUT: .local/tutorial-layout-results
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - name: Read exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read exact released layout baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fe6a5a1e01be41121eee30247c495e7aea192ae4
          path: .local/tutorial-layout-baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /index.html
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check exact source and loader contracts
        run: |
          node --check tools/layout-audit/browser.cjs
          node --test tools/layout-audit/test.cjs
          node tools/layout-audit/contract.cjs --repository
      - name: Install pinned Playwright and official Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/tutorial-layout" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/tutorial-layout/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/tutorial-layout/node_modules" >> "$GITHUB_ENV"
      - name: Measure and exercise actual desktop and mobile layouts
        run: timeout 240s node tools/layout-audit/browser.cjs
      - name: Retain before and after evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tutorial-layout-${{ github.event.pull_request.number }}
          path: .local/tutorial-layout-results/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
